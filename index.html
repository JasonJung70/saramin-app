<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>채용검색기 50+Jason</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--p:#1a56a0;--pd:#0d3d7a;--pl:#e8f0fb;--g:#2d7a3a;--gl:#e8f5eb;--a:#b85c00;--al:#fff3e0;--r:#c0392b;--bd:#dde1e9;--bg:#f0f2f5;--tx:#1a1d23;--tm:#6b7280;--tl:#9ca3af;--wh:#fff;--sh:0 2px 8px rgba(0,0,0,.1);--rd:12px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;color:var(--tx);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
/* 헤더 */
.hdr{background:var(--p);color:#fff;padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hdr-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.hdr-badge{font-size:10px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:20px}
.hdr-r{font-size:10px;opacity:.65}
/* 검색창 */
.srch{background:var(--wh);padding:10px 12px 8px;flex-shrink:0;box-shadow:var(--sh)}
.kw-row{display:flex;gap:6px;margin-bottom:8px}
.kw-inp{flex:1;height:42px;border:1.5px solid var(--bd);border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--tx);background:var(--bg)}
.kw-inp:focus{outline:none;border-color:var(--p);background:var(--wh)}
.btn-srch{height:42px;padding:0 14px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0}
.btn-srch:active{background:var(--pd)}
.btn-srch:disabled{opacity:.5}
/* 필터 */
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fi label{display:block;font-size:10px;font-weight:700;color:var(--tm);margin-bottom:2px}
.fi select{width:100%;height:33px;border:1px solid var(--bd);border-radius:8px;padding:0 6px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--wh)}
/* 결과바 */
.rbar{display:none;padding:6px 12px;background:var(--wh);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);flex-shrink:0;align-items:center;justify-content:space-between;gap:8px}
.rstat{font-size:11px;color:var(--tm)}.rstat strong{color:var(--tx);font-weight:700}
.btn-save{height:30px;padding:0 10px;background:var(--g);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn-save:active{background:#245f2d}
/* 본문 */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 70px}
/* 카드 */
.jlist{display:flex;flex-direction:column;gap:8px}
.jcard{background:var(--wh);border-radius:var(--rd);padding:13px;box-shadow:var(--sh);border-left:4px solid var(--p);position:relative}
.jc-num{position:absolute;top:10px;right:12px;font-size:10px;color:var(--tl);font-weight:600}
.jc-corp{font-size:11px;font-weight:700;color:var(--p);margin-bottom:3px;padding-right:28px}
.jc-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px;line-height:1.45;padding-right:28px}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-bottom:6px}
.b-bl{background:var(--pl);color:var(--pd)}.b-am{background:var(--al);color:var(--a)}.b-gr{background:var(--gl);color:var(--g)}.b-gy{background:#f0f2f5;color:#555}
.jc-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:8px}
.jc-it{font-size:11px;color:var(--tm);display:flex;align-items:center;gap:3px;overflow:hidden}
.jc-it span{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc-dead{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;background:var(--bg);border-radius:7px;margin-bottom:8px;font-size:11px}
.dead-lbl{color:var(--tm)}.dead-ok{color:var(--g);font-weight:600}.dead-warn{color:var(--r);font-weight:700}.dead-exp{color:var(--tl)}
.btn-go{display:flex;align-items:center;justify-content:center;width:100%;height:40px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none}
.btn-go:active{background:var(--pd)}
/* 페이지 */
.pg{display:flex;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap}
.pb{height:34px;min-width:34px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--wh);font-size:13px;cursor:pointer;color:var(--tm);font-family:inherit;font-weight:500}
.pb:active{background:var(--bg)}.pb.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}.pb:disabled{opacity:.3}
/* 빈/로딩 */
.empty{text-align:center;padding:50px 20px;color:var(--tl)}
.ei{font-size:50px;margin-bottom:10px;display:block}
.empty p{font-size:13px;line-height:1.7;color:var(--tm)}
.spin{width:34px;height:34px;border:3px solid #dde1e9;border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:10px 20px;border-radius:24px;font-size:12px;z-index:999;display:none;max-width:88vw;text-align:center;line-height:1.5}
/* 푸터 */
.foot{position:fixed;bottom:0;left:0;right:0;padding:5px;font-size:9px;color:var(--tl);text-align:center;background:rgba(255,255,255,.95);border-top:1px solid var(--bd)}
/* 오버레이(상세/저장메뉴) 공통 */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:800;display:none;align-items:flex-end;justify-content:center}
.modal-box{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 16px 32px;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.modal-title{text-align:center;font-size:14px;font-weight:700;color:var(--tx);margin-bottom:6px}
.modal-bar{width:40px;height:4px;background:#dde1e9;border-radius:2px;margin:0 auto 16px}
.modal-btn{width:100%;height:52px;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px}
.modal-desc{font-size:11px;color:var(--tm);text-align:center;margin-bottom:14px}
.modal-cancel{width:100%;height:44px;background:#f0f2f5;border:none;border-radius:12px;font-size:13px;font-weight:600;color:var(--tm);font-family:inherit;cursor:pointer;margin-top:4px}
/* 상세보기 오버레이 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:500;display:none;flex-direction:column}
.ov-hdr{background:var(--p);color:#fff;height:50px;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.2);border:none;color:#fff;height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.ov-corp-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}

.ov-jobtitle{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:14px;line-height:1.4}
.ov-row{display:flex;padding:8px 0;border-bottom:1px solid var(--bg);gap:8px}
.ov-lbl{font-size:11px;font-weight:700;color:var(--tm);width:64px;flex-shrink:0}
.ov-val{font-size:12px;color:var(--tx);flex:1;line-height:1.5}
.btn-saramin{display:flex;align-items:center;justify-content:center;width:100%;height:44px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:16px;text-decoration:none;gap:6px}
.ov-note{font-size:10px;color:var(--tl);text-align:center;margin-top:8px}
</style>
</head>

<script>
/* ══════════════════════════════
   설정
══════════════════════════════ */
var BASE  = 'https://saramin-proxy.jasonjung70.workers.dev/job-search';
var KEY   = 'Bi0yZ1iLm5pleggEpjdIVOfsgmyozIomwihPf0gAl7oppNl7ZWIK';
var MAX_PER = 100; // API 1회 최대 100건

var jobs=[], curP=1, totP=1, totC=0, pendingCnt=20, savedScrollY=0;
var now = new Date();
var todayStr = now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');

/* ── 기본 유틸 ── */
function toast(msg, ms) {
  ms = ms || 3000;
  var t = document.getElementById('toast');
  t.innerHTML = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(function(){ t.style.display='none'; }, ms);
}
function setLoading(on, msg) {
  document.getElementById('ld').style.display = on ? 'block' : 'none';
  if (msg) document.getElementById('ldMsg').textContent = msg;
  var b = document.getElementById('sb');
  b.disabled = on; b.textContent = on ? '⏳' : '🔍';
}
function showError(msg) {
  setLoading(false);
  document.getElementById('em').style.display = 'block';
  document.getElementById('emMsg').innerHTML = '⚠️ ' + msg + '<br><small style="color:#9ca3af">인터넷 연결을 확인해주세요.</small>';
  toast('❌ ' + msg, 4000);
}
function jtName(c){ return {1:'정규직',2:'계약직',3:'인턴',4:'알바'}[c]||'-'; }
function jtBadge(c){ var m={1:'b-bl',2:'b-am',3:'b-gr',4:'b-gy'}; return c?'<span class="badge '+(m[c]||'b-gy')+'">'+jtName(c)+'</span>':''; }
function expStr(n,x,nm){ if(nm)return nm; if(n===0&&x===0)return'경력무관'; if(n===0)return'신입'; return'경력 '+n+'년↑'; }
function salStr(c){ return {1:'회사내규',2:'2400만↑',3:'3000만↑',4:'3600만↑',5:'4200만↑',6:'5000만↑'}[String(c)]||'면접후결정'; }
function fmtTs(ts){
  if(!ts) return '상시채용';
  var d=new Date(ts*1000);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function deadInfo(ts){
  if(!ts) return {t:'상시채용',c:'dead-ok'};
  var d=new Date(ts*1000), diff=Math.ceil((d-now)/864e5);
  var s=fmtTs(ts);
  if(diff<0)  return {t:'마감됨('+s+')',c:'dead-exp'};
  if(diff===0) return {t:'오늘마감!('+s+')',c:'dead-warn'};
  if(diff<=7)  return {t:'D-'+diff+'·'+s,c:'dead-warn'};
  return {t:s,c:'dead-ok'};
}

/* ── XHR 공통 호출 ── */
function callXHR(url, onOk, onErr) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.setRequestHeader('Accept', 'application/json');
  xhr.timeout = 20000;
  xhr.onload = function(){
    if(xhr.status >= 200 && xhr.status < 300){
      try { onOk(JSON.parse(xhr.responseText)); }
      catch(e){ onErr('데이터 파싱 오류'); }
    } else if(xhr.status===401||xhr.status===403){ onErr('API Key 오류'); }
    else if(xhr.status===429){ onErr('일일 한도(500회) 초과'); }
    else { onErr('서버 오류: '+xhr.status); }
  };
  xhr.onerror   = function(){ onErr('네트워크 오류. 인터넷을 확인해주세요.'); };
  xhr.ontimeout = function(){ onErr('시간 초과. 다시 시도해주세요.'); };
  xhr.send();
}

/* ── URL 파라미터 생성 ── */
function buildQS(cnt, start, srt, kw, loc, jt, exp, sal){
  var qs = 'access-key='+encodeURIComponent(KEY)+'&count='+cnt+'&start='+start+'&sort='+srt;
  if(kw)  qs += '&keywords='+encodeURIComponent(kw);
  if(loc) qs += '&loc_cd='+loc;
  if(jt)  qs += '&job_type='+jt;
  if(exp) qs += '&exp_cd='+exp;
  if(sal) qs += '&sal_cd='+sal;
  return qs;
}

/* ══════════════════════════════
   검색
══════════════════════════════ */
function doSearch(p) {
  if(!p){ p=1; curP=1; }
  pendingCnt = parseInt(document.getElementById('cnt').value);

  var kw  = document.getElementById('kw').value.trim();
  var loc = document.getElementById('loc').value;
  var jt  = document.getElementById('jt').value;
  var exp = document.getElementById('exp').value;
  var sal = document.getElementById('sal').value;
  var srt = document.getElementById('srt').value;
  var cnt = pendingCnt;

  // 화면 초기화
  document.getElementById('init').style.display = 'none';
  document.getElementById('em').style.display   = 'none';
  document.getElementById('jlist').innerHTML = '';
  document.getElementById('pg').innerHTML    = '';
  document.getElementById('rbar').style.display = 'none';
  document.getElementById('mainBody').scrollTo({top:0, behavior:'smooth'});

  if(cnt <= MAX_PER){
    // 단일 호출
    setLoading(true, '검색 중입니다...');
    var qs = buildQS(cnt, (p-1)*cnt+1, srt, kw, loc, jt, exp, sal);
    callXHR(BASE+'?'+qs,
      function(data){ applyResult(data, cnt, p); },
      function(err){ showError(err); }
    );
  } else {
    // 분할 호출
    var calls    = Math.ceil(cnt / MAX_PER);
    var startIdx = (p-1)*cnt + 1;
    var collected = [];
    var totalApi  = 0;
    var done = 0, failed = false;

    setLoading(true, cnt+'건 검색 중... ('+calls+'회 분할)');

    for(var c=0; c<calls; c++){
      (function(ci){
        var cStart = startIdx + ci * MAX_PER;
        var cCount = Math.min(MAX_PER, cnt - ci * MAX_PER);
        var qs = buildQS(cCount, cStart, srt, kw, loc, jt, exp, sal);
        callXHR(BASE+'?'+qs,
          function(data){
            if(failed) return;
            var jd = data && data.jobs;
            if(!jd){ failed=true; showError('응답 오류'); return; }
            if(ci===0) totalApi = parseInt(jd.total||0);
            var batch = Array.isArray(jd.job)?jd.job:(jd.job?[jd.job]:[]);
            collected = collected.concat(batch);
            done++;
            document.getElementById('ldMsg').textContent = collected.length+'건 수집 중...';
            if(done===calls){
              applyResult({jobs:{total:totalApi, job:collected}}, cnt, p);
            }
          },
          function(err){ if(!failed){ failed=true; showError(err); } }
        );
      })(c);
    }
  }
}

function applyResult(data, cnt, p){
  var jd = data && data.jobs;
  if(!jd){ showError('응답 형식 오류'); return; }
  totC = parseInt(jd.total||0);
  jobs = Array.isArray(jd.job) ? jd.job : (jd.job ? [jd.job] : []);
  curP = p; totP = Math.ceil(totC/cnt);
  document.getElementById('tc').textContent = totC.toLocaleString();
  document.getElementById('pc').textContent = jobs.length;
  setLoading(false);
  if(!jobs.length){
    document.getElementById('em').style.display = 'block';
    document.getElementById('emMsg').innerHTML = '검색 결과가 없습니다.<br>조건을 바꿔보세요.';
  } else {
    renderCards(jobs, cnt, p);
    renderPg(cnt);
    document.getElementById('rbar').style.display = 'flex';
    toast('✅ '+totC.toLocaleString()+'건 검색 완료');
  }
}

/* ══════════════════════════════
   카드 렌더링
══════════════════════════════ */
function renderCards(list, cnt, p){
  var el = document.getElementById('jlist');
  el.innerHTML = '';
  var off = (p-1)*cnt;
  list.forEach(function(v, i){
    var corp  = (v.company&&v.company.detail&&v.company.detail.name)||'-';
    var title = (v.position&&v.position.title)||'-';
    var locRaw= (v.position&&v.position.location&&v.position.location.name)||'-';
    var loc   = locRaw.replace(/&gt;/g,'>').replace(/>/g,' › ');
    var jtc   = (v.position&&v.position['job-type']&&v.position['job-type'].code)||'';
    var elv   = (v.position&&v.position['experience-level'])||{};
    var sc    = (v.salary&&v.salary.code)||'';
    var ts    = v['expiration-timestamp']||null;
    var url   = v.url||'#';
    var dl    = deadInfo(ts);
    var idx   = off + i;

    var card = document.createElement('div');
    card.className = 'jcard';
    if(dl.c==='dead-warn') card.style.borderLeftColor = 'var(--r)';
    if(dl.c==='dead-exp')  card.style.borderLeftColor = 'var(--tl)';
    card.innerHTML =
      '<div class="jc-num">'+(idx+1)+'</div>'+
      '<div class="jc-corp">'+corp+'</div>'+
      '<div class="jc-title">'+title+'</div>'+
      jtBadge(jtc)+
      '<div class="jc-meta">'+
        '<div class="jc-it">📍<span>'+loc+'</span></div>'+
        '<div class="jc-it">💼<span>'+expStr(elv.min||0,elv.max||0,elv.name||'')+'</span></div>'+
        '<div class="jc-it">💰<span>'+salStr(sc)+'</span></div>'+
      '</div>'+
      '<div class="jc-dead"><span class="dead-lbl">⏰ 마감일</span>'+
      '<span class="'+dl.c+'">'+dl.t+'</span></div>'+
      '<button class="btn-go" onclick="openDetail('+idx+')">📋 채용공고 보기</button>';
    el.appendChild(card);
  });
}

/* ══════════════════════════════
   페이지네이션
══════════════════════════════ */
function renderPg(cnt){
  var pg = document.getElementById('pg'); pg.innerHTML='';
  if(totP<=1) return;
  function mk(l, p, dis, on){
    var b = document.createElement('button');
    b.className = 'pb'+(on?' on':''); b.textContent=l; b.disabled=dis;
    if(!dis) b.onclick = function(){ doSearch(p); };
    return b;
  }
  pg.appendChild(mk('«', 1, curP===1, false));
  pg.appendChild(mk('‹', curP-1, curP===1, false));
  var s=Math.max(1,curP-2), e=Math.min(totP,s+4);
  if(e-s<4) s=Math.max(1,e-4);
  for(var i=s;i<=e;i++) pg.appendChild(mk(i,i,false,i===curP));
  pg.appendChild(mk('›', curP+1, curP===totP, false));
  pg.appendChild(mk('»', totP, curP===totP, false));
}

function closeOverlay(){

    document.getElementById('mainBody').scrollTo({top:savedScrollY, behavior:'smooth'});

/* ══════════════════════════════
   저장 메뉴
══════════════════════════════ */
function showSaveMenu(){
  if(!jobs.length){ toast('❌ 검색 결과가 없습니다.'); return; }
  document.getElementById('saveModal').style.display = 'flex';
}
function hideSaveMenu(){
  document.getElementById('saveModal').style.display = 'none';
}

/* 공통: 데이터 행 생성 */
function buildRows(){
  var kw    = document.getElementById('kw').value.trim()||'전체';
  var locEl = document.getElementById('loc');
  var locNm = locEl.options[locEl.selectedIndex].text;
  var off   = (curP-1)*pendingCnt;
  var hdrs  = ['연번','기업명','채용 직무(공고제목)','직종분류','고용형태','경력조건','근무지역','연봉/급여','마감일','채용공고 URL','등록일','코디 메모'];
  var rows  = jobs.map(function(v, i){
    var corp   = (v.company&&v.company.detail&&v.company.detail.name)||'-';
    var title  = (v.position&&v.position.title)||'-';
    var locRaw = (v.position&&v.position.location&&v.position.location.name)||'-';
    var loc    = locRaw.replace(/&gt;/g,'>');
    var jtc    = (v.position&&v.position['job-type']&&v.position['job-type'].code)||'';
    var elv    = (v.position&&v.position['experience-level'])||{};
    var sc     = (v.salary&&v.salary.code)||'';
    var ts     = v['expiration-timestamp']||null;
    var url    = v.url||'-';
    var ind    = (v.position&&v.position.industry&&v.position.industry.name)||'-';
    var reg    = v['posting-timestamp']
                 ? (function(){ var d=new Date(v['posting-timestamp']*1000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })()
                 : todayStr.substring(0,7);
    return [off+i+1, corp, title, ind, jtName(jtc), expStr(elv.min||0,elv.max||0,elv.name||''), loc, salStr(sc), fmtTs(ts), url, reg, ''];
  });
  return {kw:kw, locNm:locNm, headers:hdrs, rows:rows};
}

/* ── CSV 다운로드 ── */
function doCSV(){
  hideSaveMenu();
  if(!jobs.length){ toast('❌ 검색 결과가 없습니다.'); return; }
  try{
    var d = buildRows();
    var t1 = '사람인 채용정보 검색결과 — '+d.kw+' | 지역: '+d.locNm+' | 검색일: '+todayStr;
    var t2 = '■ 검색키워드: '+d.kw+'  ■ 대상지역: '+d.locNm+'  ■ 총 '+totC+'건 중 '+jobs.length+'건  ■ 출처: 사람인(saramin.co.kr)';
    var lines = [t1, t2, '', d.headers.join(',')];
    d.rows.forEach(function(row){
      var line = row.map(function(cell){
        var s = String(cell||'').replace(/"/g,'""');
        return (s.indexOf(',')>=0||s.indexOf('"')>=0||s.indexOf('\n')>=0) ? '"'+s+'"' : s;
      }).join(',');
      lines.push(line);
    });
    var csv  = '\uFEFF' + lines.join('\r\n');
    var fname = '사람인_채용정보_'+d.kw+'_'+todayStr.replace(/\./g,'')+'.csv';

    // Android WebView 호환: FileReader → DataURL 방식
    var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    var reader = new FileReader();
    reader.onload = function(e){
      var a = document.createElement('a');
      a.href = e.target.result;
      a.download = fname;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); }, 1500);
      toast('✅ CSV 저장 완료!\n다운로드 폴더를 확인하세요.', 4000);
    };
    reader.readAsDataURL(blob);
  } catch(e){
    toast('❌ CSV 오류: '+e.message);
  }
}
