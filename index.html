<style>
:root{
  --p:#1a56a0;--pd:#0d3d7a;--pl:#e8f0fb;
  --g:#2d7a3a;--gl:#e8f5eb;
  --a:#b85c00;--al:#fff3e0;
  --r:#c0392b;
  --bd:#dde1e9;--bg:#f0f2f5;
  --tx:#1a1d23;--tm:#6b7280;--tl:#9ca3af;
  --wh:#fff;--sh:0 2px 8px rgba(0,0,0,.1);--rd:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;color:var(--tx);font-size:14px;display:flex;flex-direction:column;overflow:hidden}

/* 헤더 */
.hdr{background:var(--p);color:#fff;padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hdr-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.hdr-badge{font-size:10px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:20px}
.hdr-r{font-size:10px;opacity:.65}

/* 검색창 */
.srch{background:var(--wh);padding:10px 12px 8px;flex-shrink:0;box-shadow:var(--sh)}
.kw-row{display:flex;gap:6px;margin-bottom:8px}
.kw-inp{flex:1;height:42px;border:1.5px solid var(--bd);border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--tx);background:var(--bg)}
.kw-inp:focus{outline:none;border-color:var(--p);background:var(--wh)}
.btn-srch{height:42px;padding:0 14px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0}
.btn-srch:active{background:var(--pd)}
.btn-srch:disabled{opacity:.5}

/* 필터 */
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fi label{display:block;font-size:10px;font-weight:700;color:var(--tm);margin-bottom:2px}
.fi select{width:100%;height:33px;border:1px solid var(--bd);border-radius:8px;padding:0 6px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--wh)}

/* 결과바 */
.rbar{display:none;padding:6px 12px;background:var(--wh);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);flex-shrink:0;align-items:center;justify-content:space-between;gap:8px}
.rstat{font-size:11px;color:var(--tm)}.rstat strong{color:var(--tx);font-weight:700}
.btn-xl{height:30px;padding:0 10px;background:var(--g);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap}
.btn-xl:active{background:#245f2d}
.btn-xl:disabled{opacity:.5}

/* 본문 스크롤 */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 70px}

/* 카드 */
.jlist{display:flex;flex-direction:column;gap:8px}
.jcard{background:var(--wh);border-radius:var(--rd);padding:13px;box-shadow:var(--sh);border-left:4px solid var(--p);position:relative}
.jc-num{position:absolute;top:10px;right:12px;font-size:10px;color:var(--tl);font-weight:600}
.jc-corp{font-size:11px;font-weight:700;color:var(--p);margin-bottom:3px;padding-right:28px}
.jc-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px;line-height:1.45;padding-right:28px}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-bottom:6px}
.b-bl{background:var(--pl);color:var(--pd)}.b-am{background:var(--al);color:var(--a)}.b-gr{background:var(--gl);color:var(--g)}.b-gy{background:#f0f2f5;color:#555}
.jc-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:8px}
.jc-it{font-size:11px;color:var(--tm);display:flex;align-items:center;gap:3px;overflow:hidden}
.jc-it span{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc-dead{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;background:var(--bg);border-radius:7px;margin-bottom:8px;font-size:11px}
.dead-lbl{color:var(--tm)}.dead-ok{color:var(--g);font-weight:600}.dead-warn{color:var(--r);font-weight:700}.dead-exp{color:var(--tl)}
.btn-go{display:flex;align-items:center;justify-content:center;width:100%;height:40px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none;gap:5px}
.btn-go:active{background:var(--pd)}

/* 페이지네이션 */
.pg{display:flex;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap;padding-bottom:4px}
.pb{height:34px;min-width:34px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--wh);font-size:13px;cursor:pointer;color:var(--tm);font-family:inherit;font-weight:500}
.pb:active{background:var(--bg)}.pb.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}.pb:disabled{opacity:.3}

/* 빈/로딩 */
.empty{text-align:center;padding:50px 20px;color:var(--tl)}
.ei{font-size:50px;margin-bottom:10px;display:block}
.empty p{font-size:13px;line-height:1.7;color:var(--tm)}
.spin{width:34px;height:34px;border:3px solid #dde1e9;border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:10px 20px;border-radius:24px;font-size:12px;z-index:999;display:none;max-width:88vw;text-align:center;line-height:1.5}

/* 푸터 */
.foot{position:fixed;bottom:0;left:0;right:0;padding:5px;font-size:9px;color:var(--tl);text-align:center;background:rgba(255,255,255,.95);border-top:1px solid var(--bd)}

/* 상세보기 오버레이 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:500;display:none;flex-direction:column}
.ov-hdr{background:var(--p);color:#fff;height:50px;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.2);border:none;color:#fff;height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-back:active{background:rgba(255,255,255,.35)}
.ov-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}

.ov-jobtitle{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:14px;line-height:1.4}
.ov-section{margin-bottom:12px}
.ov-row{display:flex;padding:7px 0;border-bottom:1px solid var(--bg);gap:8px}
.ov-lbl{font-size:11px;font-weight:700;color:var(--tm);width:64px;flex-shrink:0;padding-top:1px}

.btn-detail:active{background:var(--pd)}
</style>
</head>

<script>
const BASE  = 'https://saramin-proxy.jasonjung70.workers.dev/job-search';
const KEY   = 'Bi0yZ1iLm5pleggEpjdIVOfsgmyozIomwihPf0gAl7oppNl7ZWIK';

let jobs=[], curP=1, totP=1, totC=0, pendingCnt=20;
let savedScrollY = 0; // ★ 스크롤 위치 저장
const now = new Date();
const todayStr = now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');

/* ── 유틸 ── */
function toast(msg,ms=3000){
  var t=document.getElementById('toast');
  t.innerHTML=msg;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},ms);
}
function setLoading(on){
  document.getElementById('ld').style.display=on?'block':'none';
  var b=document.getElementById('sb');b.disabled=on;b.textContent=on?'⏳':'🔍';
}
function showError(msg){
  setLoading(false);
  document.getElementById('em').style.display='block';
  document.getElementById('emMsg').innerHTML='⚠️ '+msg;
  toast('❌ '+msg,4000);
}
function jtName(c){return{1:'정규직',2:'계약직',3:'인턴',4:'알바'}[c]||'-';}
function jtBadge(c){var m={1:'b-bl',2:'b-am',3:'b-gr',4:'b-gy'};return c?'<span class="badge '+(m[c]||'b-gy')+'">'+jtName(c)+'</span>':'';}
function expStr(n,x,nm){if(nm)return nm;if(n===0&&x===0)return'경력무관';if(n===0)return'신입';return'경력 '+n+'년↑';}
function salStr(c){return{1:'회사내규',2:'2400만↑',3:'3000만↑',4:'3600만↑',5:'4200만↑',6:'5000만↑'}[String(c)]||'면접후결정';}
function fmtTs(ts){
  if(!ts)return'상시채용';
  var d=new Date(ts*1000);
  return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
}
function deadInfo(ts){
  if(!ts)return{t:'상시채용',c:'dead-ok'};
  var d=new Date(ts*1000),diff=Math.ceil((d-now)/864e5);
  var s=fmtTs(ts);
  if(diff<0)return{t:'마감됨('+s+')',c:'dead-exp'};
  if(diff===0)return{t:'오늘마감!('+s+')',c:'dead-warn'};
  if(diff<=7)return{t:'D-'+diff+'·'+s,c:'dead-warn'};
  return{t:s,c:'dead-ok'};
}

/* ── 검색 ── */
function doSearch(p){
  if(!p){p=1;curP=1;}
  pendingCnt=parseInt(document.getElementById('cnt').value);
  var kw=document.getElementById('kw').value.trim();
  var loc=document.getElementById('loc').value;
  var jt=document.getElementById('jt').value;
  var exp=document.getElementById('exp').value;
  var sal=document.getElementById('sal').value;
  var srt=document.getElementById('srt').value;
  var cnt=pendingCnt;

  var qs='access-key='+encodeURIComponent(KEY);
  qs+='&count='+cnt+'&start='+((p-1)*cnt+1)+'&sort='+srt;
  if(kw)  qs+='&keywords='+encodeURIComponent(kw);
  if(loc) qs+='&loc_cd='+loc;
  if(jt)  qs+='&job_type='+jt;
  if(exp) qs+='&exp_cd='+exp;
  if(sal) qs+='&sal_cd='+sal;

  ['init','em'].forEach(function(id){document.getElementById(id).style.display='none';});
  document.getElementById('jlist').innerHTML='';
  document.getElementById('pg').innerHTML='';
  document.getElementById('rbar').style.display='none';
  setLoading(true);
  document.getElementById('mainBody').scrollTo({top:0,behavior:'smooth'});

  // ★ 사람인 API 1회 최대 110건 → 대량 검색시 자동 분할 호출
  var MAX_PER_CALL = 100; // API 안전 최대치
  if(cnt <= MAX_PER_CALL){
    // 단일 호출
    callXhr(BASE+'?'+qs, cnt, p, null);
  } else {
    // 분할 호출: 예) 300건 = 100건씩 3번
    var totalNeeded = cnt;
    var startIdx = (p-1)*cnt + 1;
    var collected = [];
    var totalFromApi = 0;
    var calls = Math.ceil(totalNeeded / MAX_PER_CALL);
    var done = 0;
    var failed = false;

    toast('⏳ '+totalNeeded+'건 검색 중... ('+calls+'회 호출)');

    for(var c=0; c<calls; c++){
      (function(callIdx){
        var callStart = startIdx + callIdx * MAX_PER_CALL;
        var callCount = Math.min(MAX_PER_CALL, totalNeeded - callIdx * MAX_PER_CALL);
        var callQs = qs.replace('count='+cnt, 'count='+callCount)
                       .replace('start='+((p-1)*cnt+1), 'start='+callStart);
        callXhr(BASE+'?'+callQs, callCount, p, function(data){
          if(failed) return;
          if(!data){ failed=true; showError('데이터 오류'); return; }
          var jd = data.jobs;
          if(!jd){ failed=true; showError('응답 오류'); return; }
          if(totalFromApi===0) totalFromApi = parseInt(jd.total||0);
          var batch = Array.isArray(jd.job)?jd.job:(jd.job?[jd.job]:[]);
          collected = collected.concat(batch);
          done++;
          if(done===calls){
            // 모든 호출 완료
            var fakeData = {jobs:{total:totalFromApi, job:collected}};
            processData(fakeData, totalNeeded, p);
          }
        });
      })(c);
    }
  }
}

function processData(data,cnt,p){
  var jd=data&&data.jobs;
  if(!jd){showError('응답 오류');return;}
  totC=parseInt(jd.total||0);
  jobs=Array.isArray(jd.job)?jd.job:(jd.job?[jd.job]:[]);
  curP=p;totP=Math.ceil(totC/cnt);
  document.getElementById('tc').textContent=totC.toLocaleString();
  document.getElementById('pc').textContent=jobs.length;
  setLoading(false);
  if(!jobs.length){
    document.getElementById('em').style.display='block';
    document.getElementById('emMsg').innerHTML='검색 결과가 없습니다.<br>조건을 바꿔보세요.';
  } else {
    renderCards(jobs,cnt,p);
    renderPg(cnt);
    document.getElementById('rbar').style.display='flex';
    toast('✅ '+totC.toLocaleString()+'건 검색 완료');
  }
}

// ★ XHR 공통 호출 함수 (callback 없으면 직접 processData 호출)
function callXhr(url, cnt, p, callback){
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.setRequestHeader('Accept','application/json');
  xhr.timeout=20000;
  xhr.onload=function(){
    if(xhr.status>=200&&xhr.status<300){
      try{
        var data=JSON.parse(xhr.responseText);
        if(callback){ callback(data); }
        else{ processData(data,cnt,p); }
      } catch(e){
        if(callback){callback(null);}
        else{showError('데이터 오류');}
      }
    } else if(xhr.status===401||xhr.status===403){
      if(callback){callback(null);}else{showError('API Key 오류');}
    } else if(xhr.status===429){
      if(callback){callback(null);}else{showError('일일 한도(500회) 초과');}
    } else {
      if(callback){callback(null);}else{showError('서버오류: '+xhr.status);}
    }
  };
  xhr.onerror=function(){
    if(callback){callback(null);}else{showError('네트워크 오류. 인터넷을 확인해주세요.');}
  };
  xhr.ontimeout=function(){
    if(callback){callback(null);}else{showError('시간 초과. 다시 시도해주세요.');}
  };
  xhr.send();
}

/* ── ★ 페이지네이션 ── */
function renderPg(cnt){
  var pg=document.getElementById('pg');pg.innerHTML='';
  if(totP<=1)return;

  // 처음/이전 버튼
  var bFirst=document.createElement('button');
  bFirst.className='pb';bFirst.textContent='«';bFirst.disabled=(curP===1);
  if(curP!==1)bFirst.onclick=function(){doSearch(1);};
  pg.appendChild(bFirst);

  var bPrev=document.createElement('button');
  bPrev.className='pb';bPrev.textContent='‹';bPrev.disabled=(curP===1);
  if(curP!==1)bPrev.onclick=function(){doSearch(curP-1);};
  pg.appendChild(bPrev);

  // 페이지 번호 버튼 (현재 페이지 중심으로 5개)
  var s=Math.max(1,curP-2);
  var e=Math.min(totP,s+4);
  if(e-s<4)s=Math.max(1,e-4);

  for(var i=s;i<=e;i++){
    (function(pageNum){
      var b=document.createElement('button');
      b.className='pb'+(pageNum===curP?' on':'');
      b.textContent=pageNum;
      b.onclick=function(){doSearch(pageNum);};
      pg.appendChild(b);
    })(i);
  }

  // 다음/마지막 버튼
  var bNext=document.createElement('button');
  bNext.className='pb';bNext.textContent='›';bNext.disabled=(curP===totP);
  if(curP!==totP)bNext.onclick=function(){doSearch(curP+1);};
  pg.appendChild(bNext);

  var bLast=document.createElement('button');
  bLast.className='pb';bLast.textContent='»';bLast.disabled=(curP===totP);
  if(curP!==totP)bLast.onclick=function(){doSearch(totP);};
  pg.appendChild(bLast);
}

  var rows=jobs.map(function(v,i){
    var corp=(v.company&&v.company.detail&&v.company.detail.name)||'-';
    var title=(v.position&&v.position.title)||'-';
    var locRaw=(v.position&&v.position.location&&v.position.location.name)||'-';
    var loc=locRaw.replace(/&gt;/g,'>').replace(/>/g,'>');
    var jtc=(v.position&&v.position['job-type']&&v.position['job-type'].code)||'';
    var elv=(v.position&&v.position['experience-level'])||{};
    var sc=(v.salary&&v.salary.code)||'';
    var ts=v['expiration-timestamp']||null;
    var url=v.url||'-';
    var ind=(v.position&&v.position.industry&&v.position.industry.name)||'-';
    var reg=v['posting-timestamp']?(function(){var d=new Date(v['posting-timestamp']*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})():todayStr.substring(0,7);
    return[off+i+1,corp,title,ind,jtName(jtc),expStr(elv.min||0,elv.max||0,elv.name||''),loc,salStr(sc),fmtTs(ts),url,reg,''];
  });
  return{kw:kw,locNm:locNm,headers:headers,rows:rows};
}

var GAPI_CLIENT_ID='';  // Google Cloud Console에서 발급 (아래 안내 참고)
var GAPI_SCOPE='https://www.googleapis.com/auth/drive.file';
var gToken=null;

function doGoogleDrive(){
  hideSaveMenu();
  if(!jobs.length){toast('❌ 검색 결과가 없습니다.');return;}

  // Google Client ID 미설정시 안내
  if(!GAPI_CLIENT_ID){
    showGapiGuide();
    return;
  }
  toast('⏳ Google 로그인 중...');
  var client=google.accounts.oauth2.initTokenClient({
    client_id: GAPI_CLIENT_ID,
    scope: GAPI_SCOPE,
    callback: function(resp){
      if(resp.error){toast('❌ 로그인 실패: '+resp.error);return;}
      gToken=resp.access_token;
      uploadToDrive(gToken);
    }
  });
  client.requestAccessToken();
}

async function uploadToDrive(token){
  var btn=document.getElementById('xlBtn');
  btn.disabled=true;btn.textContent='⏳Drive 저장중..';
  try{
    var d=buildRows();
    var kw=d.kw;
    var title1='사람인 채용정보 검색결과 — '+kw+' | 지역: '+d.locNm+' | 검색일: '+todayStr;
    var title2='■ 검색키워드: '+kw+'  ■ 대상지역: '+d.locNm+'  ■ 총 '+totC+'건 중 '+jobs.length+'건  ■ 출처: 사람인(saramin.co.kr)';
    var csvRows=[title1,title2,'',d.headers.join(',')];
    d.rows.forEach(function(row){
      var line=row.map(function(cell){
        var s=String(cell||'').replace(/"/g,'""');
        return(s.includes(',')||s.includes('"')||s.includes('
'))?'"'+s+'"':s;
      }).join(',');
      csvRows.push(line);
    });
    var csvStr='﻿'+csvRows.join('
');
    var fname='사람인_채용정보_'+kw+'_'+todayStr.replace(/\./g,'')+'.csv';

    // Step1: "채용정보 저장" 폴더 찾기 또는 생성
    toast('⏳ Google Drive 폴더 확인 중...');
    var folderName='채용정보 저장';
    var folderId=await findOrCreateFolder(token, folderName);

    // Step2: CSV 파일 업로드
    toast('⏳ 파일 업로드 중...');
    var blob=new Blob([csvStr],{type:'text/csv;charset=utf-8'});
    var meta={name:fname,parents:[folderId],mimeType:'text/csv'};
    var form=new FormData();
    form.append('metadata',new Blob([JSON.stringify(meta)],{type:'application/json'}));
    form.append('file',blob);

    var res=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{
      method:'POST',
      headers:{Authorization:'Bearer '+token},
      body:form
    });
    if(!res.ok)throw new Error('업로드 실패 HTTP '+res.status);
    var file=await res.json();
    toast('✅ Google Drive "'+folderName+'" 폴더에 저장 완료!
파일명: '+fname);
  }catch(e){
    toast('❌ Drive 저장 오류: '+e.message,5000);
  }finally{
    btn.disabled=false;btn.textContent='📥 저장하기 ▼';
  }
}

async function findOrCreateFolder(token, name){
  // 폴더 검색
  var q=encodeURIComponent("name='"+name+"' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  var res=await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)',{
    headers:{Authorization:'Bearer '+token}
  });
  var data=await res.json();
  if(data.files&&data.files.length>0) return data.files[0].id;

  // 폴더 없으면 생성
  var res2=await fetch('https://www.googleapis.com/drive/v3/files',{
    method:'POST',
    headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name:name,mimeType:'application/vnd.google-apps.folder'})
  });
  var folder=await res2.json();
  return folder.id;
}
