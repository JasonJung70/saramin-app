<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>채용검색기 50+Jason</title>
<style>
:root{
  --p:#1a56a0;--pd:#0d3d7a;--pl:#e8f0fb;
  --g:#2d7a3a;--gl:#e8f5eb;
  --a:#b85c00;--al:#fff3e0;
  --r:#c0392b;
  --bd:#dde1e9;--bg:#f0f2f5;
  --tx:#1a1d23;--tm:#6b7280;--tl:#9ca3af;
  --wh:#fff;--sh:0 2px 8px rgba(0,0,0,.1);--rd:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;color:var(--tx);font-size:14px;display:flex;flex-direction:column;overflow:hidden}

/* 헤더 */
.hdr{background:var(--p);color:#fff;padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hdr-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.hdr-badge{font-size:10px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:20px}
.hdr-r{font-size:10px;opacity:.65}

/* 검색창 */
.srch{background:var(--wh);padding:10px 12px 8px;flex-shrink:0;box-shadow:var(--sh)}
.kw-row{display:flex;gap:6px;margin-bottom:8px}
.kw-inp{flex:1;height:42px;border:1.5px solid var(--bd);border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--tx);background:var(--bg)}
.kw-inp:focus{outline:none;border-color:var(--p);background:var(--wh)}
.btn-srch{height:42px;padding:0 14px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0}
.btn-srch:active{background:var(--pd)}.btn-srch:disabled{opacity:.5}

/* 필터 */
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fi label{display:block;font-size:10px;font-weight:700;color:var(--tm);margin-bottom:2px}
.fi select{width:100%;height:33px;border:1px solid var(--bd);border-radius:8px;padding:0 6px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--wh)}

/* 결과바 */
.rbar{display:none;padding:6px 12px;background:var(--wh);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);flex-shrink:0;align-items:center;justify-content:space-between;gap:8px}
.rstat{font-size:11px;color:var(--tm)}.rstat strong{color:var(--tx);font-weight:700}
.btn-save{height:30px;padding:0 10px;background:var(--g);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-save:active{background:#245f2d}

/* 본문 스크롤 */
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 70px}

/* 알림 */
.alert{padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:10px;display:none}
.al-e{background:var(--r);color:#fff;border-radius:10px}
.al-o{background:var(--g);color:#fff;border-radius:10px}

/* 카드 */
.jlist{display:flex;flex-direction:column;gap:8px}
.jcard{background:var(--wh);border-radius:var(--rd);padding:13px;box-shadow:var(--sh);border-left:4px solid var(--p);position:relative}
.jc-num{position:absolute;top:10px;right:12px;font-size:10px;color:var(--tl);font-weight:600}
.jc-corp{font-size:11px;font-weight:700;color:var(--p);margin-bottom:3px;padding-right:28px}
.jc-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px;line-height:1.45;padding-right:28px}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-bottom:6px}
.b-bl{background:var(--pl);color:var(--pd)}.b-am{background:var(--al);color:var(--a)}.b-gr{background:var(--gl);color:var(--g)}.b-gy{background:#f0f2f5;color:#555}
.jc-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:8px}
.jc-it{font-size:11px;color:var(--tm);display:flex;align-items:center;gap:3px;overflow:hidden}
.jc-it span{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc-dead{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;background:var(--bg);border-radius:7px;margin-bottom:8px;font-size:11px}
.dead-lbl{color:var(--tm)}.dead-ok{color:var(--g);font-weight:600}.dead-warn{color:var(--r);font-weight:700}.dead-exp{color:var(--tl)}
.btn-go{display:flex;align-items:center;justify-content:center;width:100%;height:40px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-go:active{background:var(--pd)}

/* 페이지네이션 */
.pg{display:flex;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap}
.pb{height:34px;min-width:34px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--wh);font-size:13px;cursor:pointer;color:var(--tm);font-family:inherit;font-weight:500}
.pb:active{background:var(--bg)}.pb.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}.pb:disabled{opacity:.3}

/* 빈/로딩 */
.empty{text-align:center;padding:50px 20px;color:var(--tl)}
.ei{font-size:50px;margin-bottom:10px;display:block}
.empty p{font-size:13px;line-height:1.7;color:var(--tm)}
.spin{width:34px;height:34px;border:3px solid #dde1e9;border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:10px 20px;border-radius:24px;font-size:12px;z-index:999;display:none;max-width:88vw;text-align:center;line-height:1.5}

/* 푸터 */
.foot{position:fixed;bottom:0;left:0;right:0;padding:5px;font-size:9px;color:var(--tl);text-align:center;background:rgba(255,255,255,.95);border-top:1px solid var(--bd)}

/* 저장 모달 */
.mbg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:800;display:none;align-items:flex-end;justify-content:center}
.mbox{background:var(--wh);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 16px 32px}
.mtitle{text-align:center;font-size:14px;font-weight:700;color:var(--tx);margin-bottom:6px}
.mbar{width:40px;height:4px;background:#dde1e9;border-radius:2px;margin:0 auto 16px}
.mbtn{width:100%;height:52px;border-radius:12px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px;background:#f5f8f5;border:1.5px solid var(--g);color:var(--g)}
.mdesc{font-size:11px;color:var(--tm);text-align:center;margin-bottom:14px}
.mcancel{width:100%;height:44px;background:#f0f2f5;border:none;border-radius:12px;font-size:13px;font-weight:600;color:var(--tm);font-family:inherit;cursor:pointer}

/* 상세 오버레이 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--wh);z-index:500;display:none;flex-direction:column}
.ov-hdr{background:var(--p);color:#fff;height:50px;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.2);border:none;color:#fff;height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.ov-ct{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.ov-corp{font-size:12px;font-weight:700;color:var(--p);margin-bottom:4px}
.ov-jt{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:14px;line-height:1.4}
.ov-row{display:flex;padding:8px 0;border-bottom:1px solid var(--bg);gap:8px}
.ov-lbl{font-size:11px;font-weight:700;color:var(--tm);width:64px;flex-shrink:0}
.ov-val{font-size:12px;color:var(--tx);flex:1;line-height:1.5}
.btn-link{display:flex;align-items:center;justify-content:center;width:100%;height:44px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:16px;text-decoration:none;gap:6px}
.btn-link:active{background:var(--pd)}
.ov-note{font-size:10px;color:var(--tl);text-align:center;margin-top:8px}
</style>
</head>
<body>

<script>
/* ══════ 설정 ══════ */
// ★ Railway 서버 URL (배포 후 실제 URL로 변경 필요)
var BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? 'http://localhost:8080/job-search'
  : window.location.origin + '/job-search';
var KEY  = 'Bi0yZ1iLm5pleggEpjdIVOfsgmyozIomwihPf0gAl7oppNl7ZWIK';
var MAX  = 100;  // API 1회 최대
var PG   = 30;   // 화면 표시 단위

var allJobs=[], curPage=1, totalPages=1, totalCount=0, savedY=0;
var now = new Date();
var todayStr = now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');

/* ── 유틸 ── */
function toast(m,ms){
  ms=ms||3000;
  var t=document.getElementById('toast');
  t.innerHTML=m;t.style.display='block';
  clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},ms);
}
function showErr(m){
  var b=document.getElementById('errBox');
  b.textContent='❌ '+m;b.style.display='block';
  setTimeout(function(){b.style.display='none';},6000);
}
function showOk(m){
  var b=document.getElementById('okBox');
  b.textContent=m;b.style.display='block';
  setTimeout(function(){b.style.display='none';},4000);
}
function setLd(on,msg){
  document.getElementById('ldDiv').style.display=on?'block':'none';
  if(msg)document.getElementById('ldMsg').textContent=msg;
  var b=document.getElementById('srchBtn');
  b.disabled=on;b.textContent=on?'⏳':'🔍';
}
function hide(ids){
  ids.forEach(function(id){
    var e=document.getElementById(id);if(e)e.style.display='none';
  });
}
function jtN(c){return{1:'정규직',2:'계약직',3:'인턴',4:'알바'}[c]||c||'-';}
function jtB(c){var m={1:'b-bl',2:'b-am',3:'b-gr',4:'b-gy'};return c?'<span class="badge '+(m[c]||'b-gy')+'">'+jtN(c)+'</span>':'';}
function eS(n,x,nm){if(nm)return nm;n=n||0;x=x||0;if(!n&&!x)return'경력무관';if(!n)return'신입';return'경력 '+n+'년↑';}
function sS(c){return{1:'회사내규',2:'2400만↑',3:'3000만↑',4:'3600만↑',5:'4200만↑',6:'5000만↑'}[String(c)]||'면접후결정';}
function fT(ts){if(!ts)return'상시채용';var d=new Date(ts*1000);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
function dI(ts){
  if(!ts)return{t:'상시채용',c:'dead-ok'};
  var d=new Date(ts*1000),diff=Math.ceil((d-now)/864e5),s=fT(ts);
  if(diff<0)return{t:'마감됨',c:'dead-exp'};
  if(diff===0)return{t:'오늘마감! '+s,c:'dead-warn'};
  if(diff<=7)return{t:'D-'+diff+' '+s,c:'dead-warn'};
  return{t:s,c:'dead-ok'};
}

/* ── XHR 호출 ── */
function xhr(url,ok,err){
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.setRequestHeader('Accept','application/json');
  x.timeout=20000;
  x.onload=function(){
    if(x.status>=200&&x.status<300){
      try{ok(JSON.parse(x.responseText));}
      catch(e){err('데이터 파싱 오류');}
    } else if(x.status===401||x.status===403){err('API Key 오류');}
    else if(x.status===429){err('일일 한도(500회) 초과');}
    else{err('서버 오류: '+x.status);}
  };
  x.onerror=function(){err('네트워크 오류. 인터넷을 확인해주세요.');};
  x.ontimeout=function(){err('시간 초과. 다시 시도해주세요.');};
  x.send();
}

/* ── QS 생성 ── */
function mkQS(cnt,start,srt,kw,loc,jt,exp,sal){
  var q='access-key='+encodeURIComponent(KEY)+'&count='+cnt+'&start='+start+'&sort='+srt;
  if(kw) q+='&keywords='+encodeURIComponent(kw);
  if(loc)q+='&loc_cd='+loc;
  if(jt) q+='&job_type='+jt;
  if(exp)q+='&exp_cd='+exp;
  if(sal)q+='&sal_cd='+sal;
  return q;
}

/* ══════ 검색 ══════ */
function doSearch(){
  var kw  = document.getElementById('kw').value.trim();
  var loc = document.getElementById('loc').value;
  var jt  = document.getElementById('jt').value;
  var exp = document.getElementById('exp').value;
  var sal = document.getElementById('sal').value;
  var srt = document.getElementById('srt').value;
  var cnt = parseInt(document.getElementById('cnt').value);

  document.getElementById('errBox').style.display='none';
  hide(['inDiv','emDiv']);
  document.getElementById('jlist').innerHTML='';
  document.getElementById('pg').innerHTML='';
  document.getElementById('rbar').style.display='none';
  document.getElementById('mainBody').scrollTo({top:0,behavior:'smooth'});

  if(cnt<=MAX){
    /* 단일 호출 */
    setLd(true,'검색 중입니다...');
    xhr(BASE+'?'+mkQS(cnt,1,srt,kw,loc,jt,exp,sal),
      function(d){applyAll(d,cnt);},
      function(e){setLd(false);showErr(e);document.getElementById('emDiv').style.display='block';document.getElementById('emMsg').textContent='오류가 발생했습니다.';}
    );
  } else {
    /* 분할 호출 */
    var calls=Math.ceil(cnt/MAX);
    var collected=[], totalApi=0, done=0, failed=false;
    setLd(true,cnt+'건 검색 중... ('+calls+'회 분할)');
    for(var c=0;c<calls;c++){
      (function(ci){
        var cS=ci*MAX+1, cC=Math.min(MAX,cnt-ci*MAX);
        xhr(BASE+'?'+mkQS(cC,cS,srt,kw,loc,jt,exp,sal),
          function(d){
            if(failed)return;
            var jd=d&&d.jobs;
            if(!jd){failed=true;setLd(false);showErr('응답 오류');return;}
            if(ci===0)totalApi=parseInt(jd.total||0);
            var b=Array.isArray(jd.job)?jd.job:(jd.job?[jd.job]:[]);
            collected=collected.concat(b);
            done++;
            document.getElementById('ldMsg').textContent=collected.length+'건 수집 중...';
            if(done===calls)applyAll({jobs:{total:totalApi,job:collected}},cnt);
          },
          function(e){if(!failed){failed=true;setLd(false);showErr(e);}}
        );
      })(c);
    }
  }
}

/* ★ 전체 저장 후 PG(30)개씩 표시 */
function applyAll(data,cnt){
  var jd=data&&data.jobs;
  if(!jd){setLd(false);showErr('응답 형식 오류');return;}
  totalCount=parseInt(jd.total||0);
  allJobs=Array.isArray(jd.job)?jd.job:(jd.job?[jd.job]:[]);
  totalPages=Math.ceil(allJobs.length/PG);
  curPage=1;
  document.getElementById('totCnt').textContent=totalCount.toLocaleString();
  setLd(false);
  if(!allJobs.length){
    document.getElementById('emDiv').style.display='block';
    document.getElementById('emMsg').innerHTML='검색 결과가 없습니다.<br>조건을 바꿔보세요.';
  } else {
    showPage(1);
    document.getElementById('rbar').style.display='flex';
    toast('✅ '+totalCount.toLocaleString()+'건 검색 완료');
  }
}

/* ★ PG(30)개씩 페이지 표시 */
function showPage(p){
  curPage=p;
  var start=(p-1)*PG;
  var pageJobs=allJobs.slice(start,start+PG);
  document.getElementById('pgCnt').textContent=pageJobs.length;
  renderCards(pageJobs,start);
  renderPg();
  document.getElementById('mainBody').scrollTo({top:0,behavior:'smooth'});
}

/* ══════ 카드 렌더링 ══════ */
function renderCards(list,offset){
  var el=document.getElementById('jlist');el.innerHTML='';
  list.forEach(function(v,i){
    var corp =(v.company&&v.company.detail&&v.company.detail.name)||'-';
    var title=(v.position&&v.position.title)||'-';
    var locR =(v.position&&v.position.location&&v.position.location.name)||'-';
    var loc  =locR.replace(/&gt;/g,'>').replace(/>/g,' › ');
    var jtc  =(v.position&&v.position['job-type']&&v.position['job-type'].code)||'';
    var elv  =(v.position&&v.position['experience-level'])||{};
    var sc   =(v.salary&&v.salary.code)||'';
    var ts   =v['expiration-timestamp']||null;
    var dl   =dI(ts);
    var absIdx=offset+i;

    var card=document.createElement('div');
    card.className='jcard';
    if(dl.c==='dead-warn')card.style.borderLeftColor='var(--r)';
    if(dl.c==='dead-exp') card.style.borderLeftColor='var(--tl)';
    card.innerHTML=
      '<div class="jc-num">'+(absIdx+1)+'</div>'+
      '<div class="jc-corp">'+corp+'</div>'+
      '<div class="jc-title">'+title+'</div>'+
      jtB(jtc)+
      '<div class="jc-meta">'+
        '<div class="jc-it">📍<span>'+loc+'</span></div>'+
        '<div class="jc-it">💼<span>'+eS(elv.min,elv.max,elv.name)+'</span></div>'+
        '<div class="jc-it">💰<span>'+sS(sc)+'</span></div>'+
      '</div>'+
      '<div class="jc-dead"><span class="dead-lbl">⏰ 마감일</span>'+
      '<span class="'+dl.c+'">'+dl.t+'</span></div>'+
      '<button class="btn-go" onclick="openOv('+absIdx+')">📋 채용공고 보기</button>';
    el.appendChild(card);
  });
}

/* ══════ 페이지네이션 ══════ */
function renderPg(){
  var pg=document.getElementById('pg');pg.innerHTML='';
  if(totalPages<=1)return;
  function mk(l,p,dis,on){
    var b=document.createElement('button');
    b.className='pb'+(on?' on':'');b.textContent=l;b.disabled=dis;
    if(!dis)b.onclick=function(){showPage(p);};return b;
  }
  pg.appendChild(mk('«',1,curPage===1,false));
  pg.appendChild(mk('‹',curPage-1,curPage===1,false));
  var s=Math.max(1,curPage-2),e=Math.min(totalPages,s+4);
  if(e-s<4)s=Math.max(1,e-4);
  for(var i=s;i<=e;i++)pg.appendChild(mk(i,i,false,i===curPage));
  pg.appendChild(mk('›',curPage+1,curPage===totalPages,false));
  pg.appendChild(mk('»',totalPages,curPage===totalPages,false));
}

/* ══════ 저장 메뉴 ══════ */
function showSave(){
  if(!allJobs.length){toast('❌ 검색 결과가 없습니다.');return;}
  document.getElementById('saveModal').style.display='flex';
}
function hideSave(){
  document.getElementById('saveModal').style.display='none';
}

/* ★ 외부 링크 열기 — 상태 저장 후 열기 */
function openJob(a, e){
  e.preventDefault();
  var url = a.getAttribute('href');
  if(!url || url==='#') return;
  // 현재 검색 상태를 sessionStorage에 저장 (뒤로가기 복원용)
  try{
    sessionStorage.setItem('savedJobs', JSON.stringify(allJobs));
    sessionStorage.setItem('savedPage', curPage);
    sessionStorage.setItem('savedTotal', totalCount);
  } catch(ex){}
  // 새 창으로 열기
  window.open(url, '_blank');
}

/* ★ 페이지 진입시 저장된 상태 복원 */
function restoreState(){
  try{
    var saved = sessionStorage.getItem('savedJobs');
    if(!saved) return;
    allJobs = JSON.parse(saved);
    totalCount = parseInt(sessionStorage.getItem('savedTotal')||0);
    totalPages = Math.ceil(allJobs.length/PG);
    var p = parseInt(sessionStorage.getItem('savedPage')||1);
    sessionStorage.removeItem('savedJobs');
    sessionStorage.removeItem('savedPage');
    sessionStorage.removeItem('savedTotal');
    if(allJobs.length > 0){
      showPage(p);
      document.getElementById('totCnt').textContent = totalCount.toLocaleString();
      document.getElementById('rbar').style.display = 'flex';
      document.getElementById('inDiv').style.display = 'none';
    }
  } catch(ex){}
}

// 페이지 로드시 복원 시도
window.addEventListener('load', restoreState);
window.addEventListener('pageshow', restoreState);

/* ★ 이메일로 CSV 전송 */
function doEmail(){
  hideSave();
  if(!allJobs.length){toast('❌ 검색 결과가 없습니다.');return;}

  var kw    = document.getElementById('kw').value.trim()||'전체';
  var locEl = document.getElementById('loc');
  var locNm = locEl.options[locEl.selectedIndex].text;

  // 이메일 제목
  var subject = '[채용정보] '+kw+' '+locNm+' 총'+allJobs.length+'건 ('+todayStr+')';

  // 이메일 본문 — 전체 포함
  var body = subject + '\n';
  body += '================================\n\n';
  for(var i=0; i<allJobs.length; i++){
    var v = allJobs[i];
    var corp  = (v.company&&v.company.detail&&v.company.detail.name)||'-';
    var title = (v.position&&v.position.title)||'-';
    var loc2  = (v.position&&v.position.location&&v.position.location.name)||'-';
    var url2  = v.url||'-';
    body += (i+1)+'. ['+corp+'] '+title+'\n';
    body += '   지역: '+loc2+'\n';
    body += '   링크: '+url2+'\n\n';
  }
  body += '출처: 사람인(saramin.co.kr)';

  // ★ <a> 태그로 직접 mailto 실행 (App Inventor 블록 불필요)
  var mailLink = document.getElementById('mailLink');
  if(!mailLink){
    mailLink = document.createElement('a');
    mailLink.id = 'mailLink';
    mailLink.style.display = 'none';
    document.body.appendChild(mailLink);
  }
  mailLink.href = 'mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  mailLink.click();
  toast('📧 이메일 앱이 실행됩니다!', 3000);
}
