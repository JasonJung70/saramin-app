<head>

<style>
:root{
  --p:#1a56a0;--pd:#0d3d7a;--pl:#e8f0fb;
  --g:#2d7a3a;--gl:#e8f5eb;
  --a:#b85c00;--al:#fff3e0;
  --r:#c0392b;
  --bd:#dde1e9;--bg:#f0f2f5;
  --tx:#1a1d23;--tm:#6b7280;--tl:#9ca3af;
  --wh:#fff;--sh:0 2px 8px rgba(0,0,0,.1);--rd:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg)}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;color:var(--tx);font-size:14px;display:flex;flex-direction:column;overflow:hidden}
.hdr{background:var(--p);color:#fff;padding:0 14px;height:50px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hdr-t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.hdr-badge{font-size:10px;background:rgba(255,255,255,.2);padding:2px 8px;border-radius:20px}
.hdr-r{font-size:10px;opacity:.65}
.srch{background:var(--wh);padding:10px 12px 8px;flex-shrink:0;box-shadow:var(--sh)}
.kw-row{display:flex;gap:6px;margin-bottom:8px}
.kw-ex{border-color:#f3c5c0!important;background:#fff9f8!important}
.kw-ex:focus{border-color:#e0584a!important}
.kw-ex::placeholder{color:#c98a82}
.kw-inp{flex:1;height:42px;border:1.5px solid var(--bd);border-radius:10px;padding:0 12px;font-size:15px;font-family:inherit;color:var(--tx);background:var(--bg)}
.kw-inp:focus{outline:none;border-color:var(--p);background:var(--wh)}
.btn-srch{height:42px;padding:0 14px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:18px;cursor:pointer;flex-shrink:0}
.btn-srch:active{background:var(--pd)}.btn-srch:disabled{opacity:.5}
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.fi label{display:block;font-size:10px;font-weight:700;color:var(--tm);margin-bottom:2px}
.fi select{width:100%;height:33px;border:1px solid var(--bd);border-radius:8px;padding:0 6px;font-size:11px;font-family:inherit;color:var(--tx);background:var(--wh)}
.rbar{display:none;padding:6px 12px;background:var(--wh);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);flex-shrink:0;align-items:center;justify-content:space-between;gap:8px}
.rstat{font-size:11px;color:var(--tm)}.rstat strong{color:var(--tx);font-weight:700}
.btn-share{height:30px;padding:0 10px;background:var(--g);color:#fff;border:none;border-radius:8px;font-size:11px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-share:active{background:#245f2d}
.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 70px}
.jlist{display:flex;flex-direction:column;gap:8px}
.jcard{background:var(--wh);border-radius:var(--rd);padding:13px;box-shadow:var(--sh);border-left:4px solid var(--p);position:relative}
.jc-num{position:absolute;top:10px;right:12px;font-size:10px;color:var(--tl);font-weight:600}
.jc-corp{font-size:11px;font-weight:700;color:var(--p);margin-bottom:3px;padding-right:28px}
.jc-title{font-size:13px;font-weight:700;color:var(--tx);margin-bottom:8px;line-height:1.45;padding-right:28px}
.badge{display:inline-block;padding:2px 7px;border-radius:20px;font-size:10px;font-weight:600;margin-bottom:6px}
.b-bl{background:var(--pl);color:var(--pd)}.b-am{background:var(--al);color:var(--a)}.b-gr{background:var(--gl);color:var(--g)}.b-gy{background:#f0f2f5;color:#555}
.jc-meta{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:8px}
.jc-it{font-size:11px;color:var(--tm);display:flex;align-items:center;gap:3px;overflow:hidden}
.jc-it span{color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jc-dead{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;background:var(--bg);border-radius:7px;margin-bottom:8px;font-size:11px}
.dead-lbl{color:var(--tm)}.dead-ok{color:var(--g);font-weight:600}.dead-warn{color:var(--r);font-weight:700}.dead-exp{color:var(--tl)}
.btn-go{display:flex;align-items:center;justify-content:center;width:100%;height:40px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.btn-go:active{background:var(--pd)}
.pg{display:flex;justify-content:center;gap:5px;margin-top:12px;flex-wrap:wrap}
.pb{height:34px;min-width:34px;padding:0 8px;border:1px solid var(--bd);border-radius:8px;background:var(--wh);font-size:13px;cursor:pointer;color:var(--tm);font-family:inherit;font-weight:500}
.pb:active{background:var(--bg)}.pb.on{background:var(--p);color:#fff;border-color:var(--p);font-weight:700}.pb:disabled{opacity:.3}
.pb-next{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important;font-weight:700!important;padding:0 12px!important;min-width:auto!important}
.pb-next:active{background:#245f2d!important}
.empty{text-align:center;padding:50px 20px;color:var(--tl)}
.ei{font-size:50px;margin-bottom:10px;display:block}
.empty p{font-size:13px;line-height:1.7;color:var(--tm)}
.spin{width:34px;height:34px;border:3px solid #dde1e9;border-top-color:var(--p);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:10px 20px;border-radius:24px;font-size:12px;z-index:999;display:none;max-width:88vw;text-align:center;line-height:1.5}
.foot{position:fixed;bottom:0;left:0;right:0;padding:5px;font-size:9px;color:var(--tl);text-align:center;background:rgba(255,255,255,.95);border-top:1px solid var(--bd)}
/* 상세 오버레이 */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--wh);z-index:500;display:none;flex-direction:column}
.ov-hdr{background:var(--p);color:#fff;height:50px;display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0}
.btn-back{background:rgba(255,255,255,.2);border:none;color:#fff;height:34px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.ov-ct{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.ov-corp{font-size:12px;font-weight:700;color:var(--p);margin-bottom:4px}
.ov-jt{font-size:16px;font-weight:700;color:var(--tx);margin-bottom:14px;line-height:1.4}
.ov-row{display:flex;padding:8px 0;border-bottom:1px solid var(--bg);gap:8px}
.ov-lbl{font-size:11px;font-weight:700;color:var(--tm);width:64px;flex-shrink:0}
.ov-val{font-size:12px;color:var(--tx);flex:1;line-height:1.5}
.btn-link{display:flex;align-items:center;justify-content:center;width:100%;height:44px;background:var(--p);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px;text-decoration:none;gap:6px}
.btn-link:active{background:var(--pd)}
/* ★ 공유하기 버튼 */
.btn-share-job{display:flex;align-items:center;justify-content:center;width:100%;height:44px;background:var(--g);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:8px;gap:6px}
.btn-share-job:active{background:#245f2d}
.ov-note{font-size:10px;color:var(--tl);text-align:center;margin-top:8px}
</style>

<script>
/* ══════ 설정 ══════ */
var BASE = 'https://saramin-proxy.jasonjung70.workers.dev/job-search';
var KEY  = 'Bi0yZ1iLm5pleggEpjdIVOfsgmyozIomwihPf0gAl7oppNl7ZWIK';
var MAX  = 100;
var PG   = 30;

var allJobs=[], curPage=1, totalPages=1, totalCount=0, savedY=0;
// ★ 배치 관련 변수 (100건씩 순차 호출)
var batchSize=100;    // API 1회 최대
var totalReq=0;       // 사용자가 요청한 총 건수
var batchStart=1;     // 다음 배치 시작 번호
var searchParams={};  // 현재 검색 파라미터 저장
var now = new Date();
var todayStr = now.getFullYear()+'.'+String(now.getMonth()+1).padStart(2,'0')+'.'+String(now.getDate()).padStart(2,'0');

/* ── 유틸 ── */
function toast(m,ms){ms=ms||3000;var t=document.getElementById('toast');t.innerHTML=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none';},ms);}
function setLd(on,msg){document.getElementById('ldDiv').style.display=on?'block':'none';if(msg)document.getElementById('ldMsg').textContent=msg;var b=document.getElementById('srchBtn');b.disabled=on;b.textContent=on?'⏳':'🔍';}
function showErr(m){setLd(false);document.getElementById('emDiv').style.display='block';document.getElementById('emMsg').innerHTML='⚠️ '+m;toast('❌ '+m,4000);}
function hide(ids){ids.forEach(function(id){var e=document.getElementById(id);if(e)e.style.display='none';});}
function jtN(c){return{1:'정규직',2:'계약직',3:'인턴',4:'알바'}[c]||c||'-';}
function jtB(c){var m={1:'b-bl',2:'b-am',3:'b-gr',4:'b-gy'};return c?'<span class="badge '+(m[c]||'b-gy')+'">'+jtN(c)+'</span>':'';}
function eS(n,x,nm){if(nm)return nm;n=n||0;x=x||0;if(!n&&!x)return'경력무관';if(!n)return'신입';return'경력 '+n+'년↑';}
function sS(c){return{1:'회사내규',2:'2400만↑',3:'3000만↑',4:'3600만↑',5:'4200만↑',6:'5000만↑'}[String(c)]||'면접후결정';}
function fT(ts){if(!ts)return'상시채용';var d=new Date(ts*1000);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
function dI(ts){
  if(!ts)return{t:'상시채용',c:'dead-ok'};
  var d=new Date(ts*1000),diff=Math.ceil((d-now)/864e5),s=fT(ts);
  if(diff<0)return{t:'마감됨',c:'dead-exp'};
  if(diff===0)return{t:'오늘마감! '+s,c:'dead-warn'};
  if(diff<=7)return{t:'D-'+diff+' '+s,c:'dead-warn'};
  return{t:s,c:'dead-ok'};
}

/* ── XHR ── */
function xhr(url,ok,err){
  var x=new XMLHttpRequest();
  x.open('GET',url,true);x.setRequestHeader('Accept','application/json');x.timeout=20000;
  x.onload=function(){
    if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText));}catch(e){err('파싱오류');}}
    else if(x.status===401||x.status===403){err('API Key 오류');}
    else if(x.status===429){err('일일 한도(500회) 초과');}
    else{err('서버 오류:'+x.status);}
  };
  x.onerror=function(){err('네트워크 오류. 인터넷을 확인해주세요.');};
  x.ontimeout=function(){err('시간 초과. 다시 시도해주세요.');};
  x.send();
}

/* ── QS ── */
function mkQS(cnt,start,srt,kw,loc,jt,exp,sal){
  var q='access-key='+encodeURIComponent(KEY)+'&count='+cnt+'&start='+start+'&sort='+srt;
  if(kw) q+='&keywords='+encodeURIComponent(kw);
  if(loc)q+='&loc_cd='+loc;
  if(jt) q+='&job_type='+jt;
  if(exp)q+='&exp_cd='+exp;
  if(sal)q+='&sal_cd='+sal;
  return q;
}

/* ══════ 검색 ══════ */
function doSearch(){
  var kw =document.getElementById('kw').value.trim();
  var exKwRaw=document.getElementById('exKw').value.trim();
  // ★ 제외검색어 — 쉼표 분리, 최대 10개
  var exListRaw=exKwRaw.split(',').map(function(s){return s.trim();}).filter(Boolean);
  if(exListRaw.length>25){
    toast('⚠️ 제외검색어는 최대 25개까지! (입력 '+exListRaw.length+'개 → 앞 25개만 적용)');
  }
  var exList=exListRaw.slice(0,25);
  var loc=document.getElementById('loc').value;
  var jt =document.getElementById('jt').value;
  var exp=document.getElementById('exp').value;
  var sal=document.getElementById('sal').value;
  var srt=document.getElementById('srt').value;
  totalReq=parseInt(document.getElementById('cnt').value);

  // 검색 파라미터 저장 (다음 배치에서 재사용)
  searchParams={kw:kw,loc:loc,jt:jt,exp:exp,sal:sal,srt:srt,exList:exList};

  hide(['inDiv','emDiv']);
  document.getElementById('jlist').innerHTML='';
  document.getElementById('pg').innerHTML='';
  document.getElementById('rbar').style.display='none';
  document.getElementById('mainBody').scrollTo({top:0,behavior:'smooth'});

  // ★ 1회 최대 100건 — 첫 번째 배치 호출
  batchStart = 1;
  allJobs = [];
  var cnt = Math.min(totalReq, batchSize);
  setLd(true,'검색 중입니다...');
  fetchBatch(1, cnt, true);
}

/* ★ 배치 단위로 API 호출 */
function fetchBatch(apiStart, cnt, isFirst){
  var p=searchParams;
  // ★ 사람인 API start 파라미터: 1부터 시작하는 순번
  var q='access-key='+encodeURIComponent(KEY)
    +'&count='+cnt+'&start='+apiStart+'&sort='+p.srt;
  if(p.kw) q+='&keywords='+encodeURIComponent(p.kw);
  if(p.loc)q+='&loc_cd='+p.loc;
  if(p.jt) q+='&job_type='+p.jt;
  if(p.exp)q+='&exp_cd='+p.exp;
  if(p.sal)q+='&sal_cd='+p.sal;

  xhr(BASE+'?'+q,
    function(d){
      var jd=d&&d.jobs;
      if(!jd){setLd(false);showErr('응답 오류');return;}

      if(isFirst) totalCount=parseInt(jd.total||0);

      var b=Array.isArray(jd.job)?jd.job:(jd.job?[jd.job]:[]);

      // ★ 제외검색어 필터링
      var exList=searchParams.exList||[];
      var excludedCnt=0;
      if(exList.length>0){
        var beforeLen=b.length;
        b=b.filter(function(j){
          var title=(j.position&&j.position.title)||'';
          var corp =(j.company&&j.company.detail&&j.company.detail.name)||'';
          var haystack=(title+' '+corp).toLowerCase();
          return !exList.some(function(ex){return haystack.indexOf(ex.toLowerCase())>=0;});
        });
        excludedCnt=beforeLen-b.length;
      }

      // ★ 핵심: ID 기준 중복 제거 후 누적
      var prevLen = allJobs.length;
      var existIds=new Set(allJobs.map(function(j){return String(j.id||'');}).filter(Boolean));
      var newJobs=b.filter(function(j){
        var key=String(j.id||'');
        return key && !existIds.has(key);
      });
      allJobs = allJobs.concat(newJobs);
      var dupCnt = b.length - newJobs.length;

      // ★ 다음 API 호출 시작 번호 = 지금까지 가져온 총 건수 + 1
      batchStart = allJobs.length + 1;

      document.getElementById('totCnt').textContent=totalCount.toLocaleString();
      setLd(false);

      if(!allJobs.length){
        document.getElementById('emDiv').style.display='block';
        document.getElementById('emMsg').innerHTML='검색 결과가 없습니다.<br>조건을 바꿔보세요.';
      } else {
        totalPages=Math.ceil(allJobs.length/PG);
        // ★ 다음 버튼 클릭 시 현재 페이지 유지, 첫 검색 시 1페이지
        if(isFirst){
          curPage=1;
          showPage(1);
        } else {
          // 추가된 첫 번째 항목이 있는 페이지로 이동
          var newPage = Math.ceil((prevLen+1)/PG);
          showPage(newPage);
        }
        document.getElementById('rbar').style.display='flex';

        var loaded=allJobs.length;
        var canLoad=Math.min(totalReq,totalCount);
        if(isFirst){
          toast('✅ 총 '+totalCount.toLocaleString()+'건 중 '
            +loaded+'건 로드 완료'
            +(loaded<canLoad?' · 다음 버튼으로 추가 로드 가능':''));
        } else {
          toast('✅ '+b.length+'건 추가 로드 (현재 '+loaded+'/'+canLoad+'건)');
        }
      }
    },
    function(e){setLd(false);showErr(e);}
  );
}

/* ★ '다음 N건' 버튼 — 누적 방식으로 추가 로드 */
function loadNext(){
  var loaded  = allJobs.length;
  var canLoad = Math.min(totalReq, totalCount);
  var remain  = canLoad - loaded;

  if(remain <= 0){
    toast('✅ 모든 데이터를 불러왔습니다! ('+loaded+'건)');
    return;
  }

  var cnt = Math.min(batchSize, remain);
  setLd(true,'추가 '+cnt+'건 불러오는 중... (현재 '+loaded+'/'+canLoad+'건)');
  // ★ batchStart = 지금까지 로드한 건수 + 1 (사람인 API 순번)
  fetchBatch(batchStart, cnt, false);
}

function applyAll(data,cnt){
  var jd=data&&data.jobs;
  if(!jd){showErr('응답형식오류');return;}
  totalCount=parseInt(jd.total||0);
  allJobs=Array.isArray(jd.job)?jd.job:(jd.job?[jd.job]:[]);
  totalPages=Math.ceil(allJobs.length/PG);
  curPage=1;
  document.getElementById('totCnt').textContent=totalCount.toLocaleString();
  setLd(false);
  if(!allJobs.length){
    document.getElementById('emDiv').style.display='block';
    document.getElementById('emMsg').innerHTML='검색 결과가 없습니다.<br>조건을 바꿔보세요.';
  } else {
    showPage(1);
    document.getElementById('rbar').style.display='flex';
    var exMsgM=excludedCnt>0?' (제외어 '+excludedCnt+'건 걸러짐)':'';
    toast('✅ '+totalCount.toLocaleString()+'건 검색 완료'+exMsgM);
  }
}

function showPage(p){
  curPage=p;
  var start=(p-1)*PG;
  var pageJobs=allJobs.slice(start,start+PG);
  document.getElementById('pgCnt').textContent=pageJobs.length;
  renderCards(pageJobs,start);
  renderPg();
  document.getElementById('mainBody').scrollTo({top:0,behavior:'smooth'});
}

/* ══════ 카드 ══════ */
function renderCards(list,offset){
  var el=document.getElementById('jlist');el.innerHTML='';
  list.forEach(function(v,i){
    var corp=(v.company&&v.company.detail&&v.company.detail.name)||'-';
    var title=(v.position&&v.position.title)||'-';
    var locR=(v.position&&v.position.location&&v.position.location.name)||'-';
    var loc=locR.replace(/&gt;/g,'>').replace(/>/g,' › ');
    var jtc=(v.position&&v.position['job-type']&&v.position['job-type'].code)||'';
    var elv=(v.position&&v.position['experience-level'])||{};
    var sc=(v.salary&&v.salary.code)||'';
    var ts=v['expiration-timestamp']||null;
    var dl=dI(ts);
    var absIdx=offset+i;
    var card=document.createElement('div');
    card.className='jcard';
    if(dl.c==='dead-warn')card.style.borderLeftColor='var(--r)';
    if(dl.c==='dead-exp')card.style.borderLeftColor='var(--tl)';
    card.innerHTML=
      '<div class="jc-num">'+(absIdx+1)+'</div>'+
      '<div class="jc-corp">'+corp+'</div>'+
      '<div class="jc-title">'+title+'</div>'+
      jtB(jtc)+
      '<div class="jc-meta">'+
        '<div class="jc-it">📍<span>'+loc+'</span></div>'+
        '<div class="jc-it">💼<span>'+eS(elv.min,elv.max,elv.name)+'</span></div>'+
        '<div class="jc-it">💰<span>'+sS(sc)+'</span></div>'+
      '</div>'+
      '<div class="jc-dead"><span class="dead-lbl">⏰ 마감일</span>'+
      '<span class="'+dl.c+'">'+dl.t+'</span></div>'+
      '<button class="btn-go" onclick="openOv('+absIdx+')">📋 채용공고 보기</button>';
    el.appendChild(card);
  });
}

/* ══════ 페이지네이션 ══════ */
function renderPg(){
  var pg=document.getElementById('pg');pg.innerHTML='';

  // ★ 페이지 버튼
  function mk(l,p,dis,on){
    var b=document.createElement('button');
    b.className='pb'+(on?' on':'');b.textContent=l;b.disabled=dis;
    if(!dis)b.onclick=function(){showPage(p);};return b;
  }

  if(totalPages>1){
    pg.appendChild(mk('«',1,curPage===1,false));
    pg.appendChild(mk('‹',curPage-1,curPage===1,false));
    var s=Math.max(1,curPage-2),e=Math.min(totalPages,s+4);
    if(e-s<4)s=Math.max(1,e-4);
    for(var i=s;i<=e;i++)pg.appendChild(mk(i,i,false,i===curPage));
    pg.appendChild(mk('›',curPage+1,curPage===totalPages,false));
    pg.appendChild(mk('»',totalPages,curPage===totalPages,false));
  }

  // ★ '다음 100건' 버튼 — 더 불러올 데이터가 있을 때만 표시
  // ★ 다음 버튼: 요청건수보다 아직 덜 불러왔을 때 표시
var loaded = allJobs.length;
var canLoad = Math.min(totalReq, totalCount);
var hasMore = (loaded < canLoad);
  if(hasMore){
    var sep=document.createElement('span');
    sep.style.cssText='color:#dde1e9;margin:0 4px;font-size:18px;line-height:34px';
    sep.textContent='|';
    pg.appendChild(sep);

    var remain=Math.min(totalReq,totalCount)-allJobs.length;
    var loaded2=allJobs.length;
    var canLoad2=Math.min(totalReq,totalCount);
    var nextCnt=Math.min(batchSize,canLoad2-loaded2);
    var btnNext=document.createElement('button');
    btnNext.className='pb pb-next';
    btnNext.textContent='▶ 다음 '+nextCnt+'건 로드 ('+loaded2+'/'+canLoad2+'건)';
    btnNext.onclick=function(){loadNext();};
    pg.appendChild(btnNext);
  }
}

/* ══════ 상세 오버레이 ══════ */
/* ★ 외부 공고 열기 — sessionStorage 저장 후 새창 */
function openJob(e, a){
  e.preventDefault();
  var url = a.getAttribute('href');
  if(!url || url==='#') return;
  // 현재 상태 저장
  try{
    sessionStorage.setItem('sj_jobs', JSON.stringify(allJobs));
    sessionStorage.setItem('sj_page', String(curPage));
    sessionStorage.setItem('sj_total', String(totalCount));
    sessionStorage.setItem('sj_batchStart', String(batchStart));
    sessionStorage.setItem('sj_totalReq', String(totalReq));
    sessionStorage.setItem('sj_params', JSON.stringify(searchParams));
  } catch(ex){}
  window.open(url, '_blank');
}

/* ★ 페이지 진입시 이전 검색결과 복원 */
function restoreState(){
  try{
    var saved = sessionStorage.getItem('sj_jobs');
    if(!saved) return;
    allJobs = JSON.parse(saved);
    if(!allJobs.length) return;
    curPage    = parseInt(sessionStorage.getItem('sj_page') || '1');
    totalCount = parseInt(sessionStorage.getItem('sj_total') || '0');
    batchStart = parseInt(sessionStorage.getItem('sj_batchStart') || '1');
    totalReq   = parseInt(sessionStorage.getItem('sj_totalReq') || '0');
    try{ searchParams = JSON.parse(sessionStorage.getItem('sj_params') || '{}'); }catch(ex){}
    // 세션 삭제
    ['sj_jobs','sj_page','sj_total','sj_batchStart','sj_totalReq','sj_params'].forEach(function(k){
      sessionStorage.removeItem(k);
    });
    // UI 복원
    totalPages = Math.ceil(allJobs.length / PG);
    document.getElementById('totCnt').textContent = totalCount.toLocaleString();
    document.getElementById('inDiv').style.display = 'none';
    document.getElementById('emDiv').style.display = 'none';
    showPage(curPage);
    document.getElementById('rbar').style.display = 'flex';
  } catch(ex){}
}
window.addEventListener('pageshow', function(e){
  restoreState();
});

  var elv=(v.position&&v.position['experience-level'])||{};
  var sal2=sS((v.salary&&v.salary.code)||'');
  var edu=(v.position&&v.position['required-education-level']&&v.position['required-education-level'].name)||'학력무관';
  var dead2=fT(v['expiration-timestamp']||null);
  var url=v.url||'#';
  var ind=(v.position&&v.position.industry&&v.position.industry.name)||'-';
  var shareText=corp+'\n'+title+'\n'+loc+' | '+sal2+' | '+dead2+'\n'+url;

  document.getElementById('ovTitle').textContent=corp;
  document.getElementById('ovBody').innerHTML=
    '<div class="ov-corp">'+corp+'</div>'+
    '<div class="ov-jt">'+title+'</div>'+
    '<div class="ov-row"><span class="ov-lbl">직종</span><span class="ov-val">'+ind+'</span></div>'+
    '<div class="ov-row"><span class="ov-lbl">고용형태</span><span class="ov-val">'+jtn+'</span></div>'+
    '<div class="ov-row"><span class="ov-lbl">경력</span><span class="ov-val">'+eS(elv.min,elv.max,elv.name)+'</span></div>'+
    '<div class="ov-row"><span class="ov-lbl">학력</span><span class="ov-val">'+edu+'</span></div>'+
    '<div class="ov-row"><span class="ov-lbl">연봉</span><span class="ov-val">'+sal2+'</span></div>'+
    '<div class="ov-row"><span class="ov-lbl">근무지</span><span class="ov-val">'+loc+'</span></div>'+
    '<div class="ov-row"><span class="ov-lbl">마감일</span><span class="ov-val">'+dead2+'</span></div>'+
    '<a href="'+url+'" class="btn-link" onclick="openJob(event,this)">🔗 사람인에서 공고 보기</a>'+
    '<button class="btn-share-job" onclick="shareJob(\''+encodeURIComponent(shareText)+'\')">📤 이 공고 공유하기</button>'+
    '<p class="ov-note">공유하기로 카카오톡, 문자, 이메일 등으로 전송 가능합니다</p>';
}

function closeOv(){
  document.getElementById('overlay').style.display='none';
  setTimeout(function(){document.getElementById('mainBody').scrollTo({top:savedY,behavior:'smooth'});},100);
}

/* ══════ ★ 공유하기 기능 ══════ */

/* 개별 공고 공유 */
function shareJob(encoded){
  var text=decodeURIComponent(encoded);
  if(navigator.share){
    navigator.share({title:'채용공고 공유',text:text})
    .catch(function(){});
  } else {
    // fallback: 클립보드 복사
    copyToClipboard(text);
    toast('📋 클립보드에 복사됐습니다!\n카카오톡, 문자 등에 붙여넣기 하세요.',3000);
  }
}

/* 전체 검색결과 공유 */
function doShare(){
  if(!allJobs.length){toast('❌ 검색 결과가 없습니다.');return;}
  var kw=document.getElementById('kw').value.trim()||'전체';
  var locEl=document.getElementById('loc');
  var locNm=locEl.options[locEl.selectedIndex].text;

  var text='[채용정보] '+kw+' · '+locNm+' (총'+totalCount+'건 중 '+allJobs.length+'건)\n';
  text+='검색일: '+todayStr+'\n';
  text+='================================\n\n';

  // 전체 건수 포함
  for(var i=0;i<allJobs.length;i++){
    var v=allJobs[i];
    var corp=(v.company&&v.company.detail&&v.company.detail.name)||'-';
    var title=(v.position&&v.position.title)||'-';
    var locR=(v.position&&v.position.location&&v.position.location.name)||'-';
    var url=v.url||'-';
    text+=(i+1)+'. ['+corp+'] '+title+'\n';
    text+='   '+locR.replace(/&gt;/g,'>')+'\n';
    text+='   '+url+'\n\n';
  }
  text+='출처: 사람인(saramin.co.kr)';

  // ★ Android Web Share API 사용
  if(navigator.share){
    navigator.share({
      title:'[채용정보] '+kw+' '+allJobs.length+'건',
      text:text
    }).then(function(){
      toast('✅ 공유 완료!');
    }).catch(function(e){
      if(e.name!=='AbortError'){
        copyToClipboard(text);
        toast('📋 클립보드에 복사됐습니다!',3000);
      }
    });
  } else {
    // Web Share API 미지원시 클립보드 복사
    copyToClipboard(text);
    toast('📋 클립보드에 복사됐습니다!\n카카오톡, 문자, 이메일에 붙여넣기 하세요.',4000);
  }
}

/* 클립보드 복사 */
function copyToClipboard(text){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).catch(function(){
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');}catch(e){}
  document.body.removeChild(ta);
}
</script>
