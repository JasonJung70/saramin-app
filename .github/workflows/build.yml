name: Build Windows EXE

on:
  push:
    paths:
      - 'saramin_desktop.py'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11 (64-bit)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        architecture: 'x64'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller openpyxl requests

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name "SaraminJobSearch" --collect-all tkinter --collect-all openpyxl saramin_desktop.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: SaraminJobSearch-Windows64
        path: dist/SaraminJobSearch.exe
        retention-days: 30
